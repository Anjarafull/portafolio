<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobranza al Día — controla tu cartera y cobra a tiempo</title>
<meta name="description" content="Registra tus facturas, mira quién te debe y envía el recordatorio de cobro por WhatsApp en dos clics. Funciona en tu navegador, sin instalar nada.">
<meta name="theme-color" content="#2a78d6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232a78d6'/><path d='M28 62l16-16 12 12 18-24' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7;
  --surface:#fcfcfb;
  --surface-2:#f2f1ed;
  --ink:#0b0b0b;
  --ink-2:#52514e;
  --muted:#898781;
  --line:#e1e0d9;
  --axis:#c3c2b7;
  --accent:#2a78d6;
  --accent-ink:#1c5cab;
  --accent-soft:#e8f0fc;
  --good:#0ca30c;
  --good-ink:#006300;
  --warning:#fab219;
  --serious:#ec835a;
  --critical:#d03b3b;
  --ring:rgba(11,11,11,0.10);
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 8px 24px -12px rgba(11,11,11,.18);
  --r:10px;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0d0d0d;
    --surface:#1a1a19;
    --surface-2:#232322;
    --ink:#ffffff;
    --ink-2:#c3c2b7;
    --muted:#898781;
    --line:#2c2c2a;
    --axis:#383835;
    --accent:#3987e5;
    --accent-ink:#86b6ef;
    --accent-soft:#16273c;
    --good:#0ca30c;
    --warning:#fab219;
    --serious:#ec835a;
    --critical:#d03b3b;
    --ring:rgba(255,255,255,0.10);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.05rem}
h2{font-size:1.15rem}
h3{font-size:.95rem}
p{margin:0}
a{color:var(--accent-ink)}
button{font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}

/* ---------- barra superior ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1120px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand .logo{
  width:28px;height:28px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;flex:none;
}
.brand .logo svg{width:17px;height:17px}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.1}
.plan{
  font-size:.72rem;font-weight:650;padding:3px 9px;border-radius:99px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);
  white-space:nowrap;
}
.plan.pro{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}

/* ---------- pestañas ---------- */
.tabs{
  max-width:1120px;margin:0 auto;padding:0 8px;
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 12px;color:var(--ink-2);font-weight:550;cursor:pointer;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{
  display:inline-block;margin-left:6px;font-size:.7rem;font-weight:650;
  background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:1px 7px;
}
.tab .count.alerta{background:#fbeaea;color:#a12b2b}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tab .count.alerta{background:#3a1d1d;color:#f0a3a3}
}

main{max-width:1120px;margin:0 auto;padding:18px 16px 80px}
section[hidden]{display:none}

/* ---------- piezas ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;
}
.card + .card{margin-top:14px}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2,.card-h h3{margin-right:auto}
.sub{color:var(--muted);font-size:.82rem}

.btn{
  appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  text-decoration:none;
  border-radius:8px;padding:7px 12px;font-weight:550;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.wa{background:#25D366;border-color:transparent;color:#0a2e17}
.btn.wa:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn.danger{color:var(--critical)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:.8rem;color:var(--ink-2);margin-bottom:4px;font-weight:550}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:96px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- tarjetas KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;
}
.kpi .k-l{font-size:.78rem;color:var(--ink-2);font-weight:550;display:flex;align-items:center;gap:6px}
.kpi .k-v{font-size:1.7rem;font-weight:680;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.kpi .k-c{font-size:.78rem;color:var(--muted);margin-top:4px}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.dot.good{background:var(--good)}
.dot.warning{background:var(--warning)}
.dot.serious{background:var(--serious)}
.dot.critical{background:var(--critical)}
.dot.neutral{background:var(--axis)}

/* ---------- barra de antigüedad ---------- */
.aging-bar{display:flex;width:100%;height:26px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.aging-bar span{
  height:100%;border-right:2px solid var(--surface);
  transition:filter .12s;
}
.aging-bar span:last-child{border-right:0}
.aging-bar span:hover{filter:brightness(1.08)}
.aging-legend{width:100%;border-collapse:collapse;margin-top:12px;font-size:.86rem}
.aging-legend th{
  text-align:right;font-weight:550;color:var(--muted);font-size:.76rem;
  padding:0 0 6px;border-bottom:1px solid var(--line);
}
.aging-legend th:first-child{text-align:left}
.aging-legend td{padding:7px 0;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.aging-legend td:first-child{text-align:left;font-variant-numeric:normal}
.aging-legend tr:last-child td{border-bottom:0}
.aging-legend .lbl{display:flex;align-items:center;gap:8px}

/* ---------- ranking deudores ---------- */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.rank .n{font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .v{font-variant-numeric:tabular-nums;font-weight:600}
.rank .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex;gap:2px}
.rank .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.rank .bar i.ven{background:var(--critical)}
.rank .meta{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:-2px}

/* ---------- tablas ---------- */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.data{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
table.data th{
  text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;
  color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--axis);
  white-space:nowrap;
}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:hover td{background:var(--surface-2)}
table.data .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;
  padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;
}
.pill .dot{width:7px;height:7px;border-radius:2px}

/* ---------- cola de cobro ---------- */
.queue{display:grid;gap:12px}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.q-card.crit{border-left:3px solid var(--critical)}
.q-card.ser{border-left:3px solid var(--serious)}
.q-card.warn{border-left:3px solid var(--warning)}
.q-card.ok{border-left:3px solid var(--good)}
.q-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.q-top .who{margin-right:auto;min-width:0}
.q-top .who b{display:block;font-size:1rem}
.q-amt{text-align:right;font-variant-numeric:tabular-nums}
.q-amt b{font-size:1.15rem}
.q-amt small{display:block;color:var(--muted);font-size:.76rem}
.q-msg{margin-top:11px}
.q-msg textarea{min-height:110px;background:var(--surface-2);font-size:.88rem}
.q-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ---------- estados vacíos ---------- */
.empty{text-align:center;padding:38px 18px;color:var(--ink-2)}
.empty h3{margin-bottom:6px}
.empty p{color:var(--muted);max-width:44ch;margin:0 auto 14px}

/* ---------- modales ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(11,11,11,.45);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;
}
.modal{
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
  width:100%;max-width:560px;margin:auto;border:1px solid var(--line);
}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin-right:auto}
.modal-b{padding:18px}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{appearance:none;border:0;background:none;color:var(--muted);font-size:1.4rem;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- avisos ---------- */
.note{
  border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:8px;padding:11px 13px;font-size:.86rem;color:var(--ink-2);
}
.note.warn{border-left-color:var(--warning);background:#fdf4e0}
.note.crit{border-left-color:var(--critical);background:#fbeaea}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .note.warn{background:#2e2718}
  :root:not([data-theme="light"]) .note.crit{background:#2e1c1c}
}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:var(--plane);padding:10px 16px;border-radius:99px;
  font-size:.88rem;font-weight:550;z-index:90;box-shadow:var(--shadow);
}

/* ---------- estado de cuenta imprimible ---------- */
#estado-print{display:none}
@media print{
  body{background:#fff;color:#000}
  .top,.tabs,main,.modal-bg,.toast{display:none !important}
  #estado-print{display:block !important;padding:0;font-size:12px}
  #estado-print table{width:100%;border-collapse:collapse}
  #estado-print th{text-align:left;border-bottom:1.5px solid #000;padding:6px 4px;font-size:11px}
  #estado-print td{border-bottom:1px solid #ccc;padding:6px 4px}
  #estado-print .num{text-align:right}
  @page{margin:16mm}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M28 62l16-16 12 12 18-24" stroke="#fff" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div>
        <h1>Cobranza al Día</h1>
        <small id="empresa-label">Tu cartera, bajo control</small>
      </div>
    </div>
    <span class="plan" id="plan-badge">Gratis</span>
    <button class="btn sm" id="btn-nueva-factura">+ Factura</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" data-tab="panel" aria-selected="true">Panel</button>
    <button class="tab" role="tab" data-tab="cobrar" aria-selected="false">Cobrar hoy <span class="count" id="c-cobrar">0</span></button>
    <button class="tab" role="tab" data-tab="facturas" aria-selected="false">Facturas <span class="count" id="c-facturas">0</span></button>
    <button class="tab" role="tab" data-tab="clientes" aria-selected="false">Clientes <span class="count" id="c-clientes">0</span></button>
    <button class="tab" role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
  </nav>
</header>

<main>
  <section id="tab-panel"></section>
  <section id="tab-cobrar" hidden></section>
  <section id="tab-facturas" hidden></section>
  <section id="tab-clientes" hidden></section>
  <section id="tab-ajustes" hidden></section>
</main>

<div id="modal-root"></div>
<div id="estado-print"></div>

<script>
/* =========================================================================
   Cobranza al Día — app de cuentas por cobrar, 100% en el navegador.
   Los datos viven en localStorage del equipo del cliente. No hay servidor.
   ========================================================================= */
(function(){
'use strict';

/* ------------------------------ constantes ------------------------------ */
var STORE = 'cobranza.v1';
var LIMITE_GRATIS = 15;           // facturas activas en el plan gratuito
var SAL = 'cbz-2026-antoine';     // sal de las licencias (ver README)

var BUCKETS = [
  {id:'vigente', nom:'Aún no vence',   min:-1e9, max:-1, estado:'neutral',  color:'var(--axis)'},
  {id:'b30',     nom:'1 a 30 días',    min:0,    max:30, estado:'warning',  color:'var(--warning)'},
  {id:'b60',     nom:'31 a 60 días',   min:31,   max:60, estado:'serious',  color:'var(--serious)'},
  {id:'b90',     nom:'61 a 90 días',   min:61,   max:90, estado:'critical', color:'var(--critical)'},
  {id:'b90m',    nom:'Más de 90 días', min:91,   max:1e9,estado:'critical', color:'#8f2323'}
];

var PLANTILLAS_DEFAULT = {
  previo:  'Hola {cliente}, buen día. Le recuerdo que la factura {folio} por {monto} vence el {vence}. Cualquier duda con gusto la vemos. Saludos, {empresa}.',
  leve:    'Hola {cliente}, buen día. La factura {folio} por {monto} venció el {vence} ({dias} días). ¿Me confirma la fecha de pago para dejarla programada? Gracias, {empresa}.',
  media:   'Hola {cliente}. La factura {folio} por {monto} lleva {dias} días vencida (venció el {vence}). Necesito confirmar hoy la fecha de pago para no suspender el servicio. Quedo pendiente, {empresa}.',
  fuerte:  'Hola {cliente}. La factura {folio} por {monto} acumula {dias} días de atraso. Es el último recordatorio antes de pasar el saldo a cobranza formal. Le pido me confirme el pago hoy mismo. {empresa}.'
};

/* ------------------------------- utilidades ----------------------------- */
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $$(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(v){ var n = parseFloat(String(v==null?'':v).replace(/[^0-9.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return isFinite(n)?n:0; }
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return (n<10?'0':'')+n; }
function parseFecha(iso){
  if(!iso) return null;
  var p = String(iso).slice(0,10).split('-');
  if(p.length!==3) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d.getTime())?null:d;
}
function diasEntre(isoA, isoB){
  var a = parseFecha(isoA), b = parseFecha(isoB);
  if(!a||!b) return 0;
  return Math.round((b-a)/86400000);
}
function fmtFecha(iso){
  var d = parseFecha(iso);
  if(!d) return '—';
  var m = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();
}
function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2400);
}
function descargar(nombre, contenido, tipo){
  var blob = new Blob([contenido], {type:(tipo||'text/plain')+';charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function copiar(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('Copiado'); },function(){ copiarFallback(txt); });
  } else { copiarFallback(txt); }
}
function copiarFallback(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copiado'); }catch(e){ toast('No se pudo copiar'); }
  ta.remove();
}

/* ------------------------------- estado --------------------------------- */
var S = null;

function estadoInicial(){
  return {
    version: 1,
    empresa: { nombre:'', moneda:'MXN', pais:'52', firma:'' },
    plantillas: JSON.parse(JSON.stringify(PLANTILLAS_DEFAULT)),
    ajustes: { avisoPrevio: 3 },
    clientes: [],
    facturas: [],
    licencia: null
  };
}
function cargar(){
  var raw = null;
  try { raw = localStorage.getItem(STORE); } catch(e){}
  if(!raw){ S = estadoInicial(); return; }
  try {
    var d = JSON.parse(raw);
    S = estadoInicial();
    if(d.empresa) Object.assign(S.empresa, d.empresa);
    if(d.plantillas) Object.assign(S.plantillas, d.plantillas);
    if(d.ajustes) Object.assign(S.ajustes, d.ajustes);
    S.clientes = Array.isArray(d.clientes)?d.clientes:[];
    S.facturas = Array.isArray(d.facturas)?d.facturas:[];
    S.licencia = d.licencia || null;
  } catch(e){ S = estadoInicial(); }
}
function guardar(){
  try { localStorage.setItem(STORE, JSON.stringify(S)); }
  catch(e){ toast('No se pudo guardar: almacenamiento lleno o bloqueado'); }
}

/* ------------------------------- licencia -------------------------------- */
var ALFA = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function fnv(str){
  var h = 0x811c9dc5;
  for(var i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}
function bloque(semilla){
  var h = fnv(semilla), out = '';
  for(var i=0;i<4;i++){
    out += ALFA.charAt(h % 32);
    h = Math.imul(h ^ (h>>>7), 0x01000193) >>> 0;
  }
  return out;
}
function claveDe(correo){
  var base = String(correo||'').trim().toLowerCase() + '|' + SAL;
  return 'CBZ-' + bloque('a'+base) + '-' + bloque('b'+base) + '-' + bloque('c'+base);
}
function licenciaValida(){
  if(!S.licencia || !S.licencia.correo || !S.licencia.clave) return false;
  return claveDe(S.licencia.correo) === String(S.licencia.clave).trim().toUpperCase();
}
function esPro(){ return licenciaValida(); }
function exigirPro(motivo){
  if(esPro()) return true;
  modalPro(motivo);
  return false;
}

/* ---------------------------- cálculos de cartera ------------------------ */
function cliente(id){
  for(var i=0;i<S.clientes.length;i++) if(S.clientes[i].id===id) return S.clientes[i];
  return null;
}
function nombreCliente(id){ var c = cliente(id); return c?c.nombre:'(sin cliente)'; }
function factura(id){
  for(var i=0;i<S.facturas.length;i++) if(S.facturas[i].id===id) return S.facturas[i];
  return null;
}
function pagado(f){
  return (f.pagos||[]).reduce(function(a,p){ return a + num(p.monto); }, 0);
}
function saldo(f){
  var s = num(f.monto) - pagado(f);
  return s < 0.005 ? 0 : s;
}
function estaPagada(f){ return saldo(f) <= 0.005; }
function diasVencido(f, hoy){
  return diasEntre(f.vence, hoy || hoyISO());
}
function abiertas(){ return S.facturas.filter(function(f){ return !estaPagada(f); }); }
function bucketDe(dias){
  for(var i=0;i<BUCKETS.length;i++){
    if(dias >= BUCKETS[i].min && dias <= BUCKETS[i].max) return BUCKETS[i];
  }
  return BUCKETS[0];
}
var LOCALES = {
  MXN:'es-MX', USD:'en-US', EUR:'es-ES', COP:'es-CO', ARS:'es-AR', CLP:'es-CL',
  PEN:'es-PE', DOP:'es-DO', GTQ:'es-GT', CRC:'es-CR', UYU:'es-UY', BOB:'es-BO',
  PYG:'es-PY', HNL:'es-HN', NIO:'es-NI', BRL:'pt-BR'
};
function fmtMoneda(v, dec){
  var cur = S.empresa.moneda || 'MXN';
  try {
    return new Intl.NumberFormat(LOCALES[cur] || 'es-MX',
      {style:'currency', currency:cur, minimumFractionDigits:dec, maximumFractionDigits:dec}).format(v||0);
  } catch(e){
    return (cur+' ') + (v||0).toFixed(dec);
  }
}
function moneda(v){ return fmtMoneda(v, 2); }
function monedaCorta(v){ return fmtMoneda(v, 0); }

function resumen(){
  var hoy = hoyISO();
  var r = {
    total:0, vencido:0, vigente:0, semana:0, cobradoMes:0,
    nAbiertas:0, nVencidas:0, buckets:{}, deudores:{}, diasPondSum:0
  };
  BUCKETS.forEach(function(b){ r.buckets[b.id] = {monto:0, n:0, def:b}; });

  var mes = hoy.slice(0,7);
  S.facturas.forEach(function(f){
    (f.pagos||[]).forEach(function(p){
      if(String(p.fecha||'').slice(0,7) === mes) r.cobradoMes += num(p.monto);
    });
    var s = saldo(f);
    if(s <= 0.005) return;
    var d = diasVencido(f, hoy);
    var b = bucketDe(d);
    r.total += s; r.nAbiertas++;
    r.buckets[b.id].monto += s; r.buckets[b.id].n++;
    if(d >= 0){ r.vencido += s; r.nVencidas++; r.diasPondSum += s*d; }
    else { r.vigente += s; if(d >= -7) r.semana += s; }
    var cid = f.clienteId || 'sin';
    if(!r.deudores[cid]) r.deudores[cid] = {id:cid, total:0, vencido:0, n:0};
    r.deudores[cid].total += s;
    r.deudores[cid].n++;
    if(d >= 0) r.deudores[cid].vencido += s;
  });
  r.pctVencido = r.total > 0 ? (r.vencido / r.total * 100) : 0;
  r.diasProm = r.vencido > 0 ? (r.diasPondSum / r.vencido) : 0;
  r.topDeudores = Object.keys(r.deudores).map(function(k){ return r.deudores[k]; })
    .sort(function(a,b){ return (b.vencido - a.vencido) || (b.total - a.total); }).slice(0,6);
  return r;
}

/* ----------------------------- mensajes de cobro ------------------------- */
function tonoDe(dias){
  if(dias < 0) return 'previo';
  if(dias <= 15) return 'leve';
  if(dias <= 45) return 'media';
  return 'fuerte';
}
function mensajeDe(f){
  var dias = diasVencido(f);
  var tpl = S.plantillas[tonoDe(dias)] || PLANTILLAS_DEFAULT.leve;
  var c = cliente(f.clienteId);
  var nom = c ? c.nombre : 'estimado cliente';
  var empresa = S.empresa.nombre || 'su proveedor';
  return tpl
    .replace(/\{cliente\}/g, nom)
    .replace(/\{contacto\}/g, c ? String(c.nombre).split(' ')[0] : '')
    .replace(/\{folio\}/g, f.folio || 's/folio')
    .replace(/\{monto\}/g, moneda(saldo(f)))
    .replace(/\{vence\}/g, fmtFecha(f.vence))
    .replace(/\{dias\}/g, Math.max(0, dias))
    .replace(/\{empresa\}/g, empresa)
    .replace(/\{firma\}/g, S.empresa.firma || empresa);
}
function telWhats(tel){
  var d = String(tel||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.charAt(0)==='0') d = d.replace(/^0+/,'');
  var pais = String(S.empresa.pais||'').replace(/\D/g,'');
  if(pais && d.length <= 10) d = pais + d;
  return d;
}
function linkWhats(f, msg){
  var c = cliente(f.clienteId);
  var t = telWhats(c && c.telefono);
  var texto = encodeURIComponent(msg);
  return t ? ('https://wa.me/'+t+'?text='+texto) : ('https://wa.me/?text='+texto);
}

/* =============================== COBRAR ================================= */
function colaCobro(){
  var hoy = hoyISO();
  var aviso = parseInt(S.ajustes.avisoPrevio,10); if(!isFinite(aviso)) aviso = 3;
  return abiertas().filter(function(f){
    return diasVencido(f, hoy) >= -aviso;
  }).map(function(f){
    var d = diasVencido(f, hoy);
    return {f:f, dias:d, saldo:saldo(f), score: saldo(f) * (1 + Math.max(0,d)/30)};
  }).sort(function(a,b){ return b.score - a.score; });
}
function renderCobrar(){
  var el = $('#tab-cobrar');
  var cola = colaCobro();

  if(cola.length === 0){

/* ============================== FACTURAS ================================ */
var filtroFacturas = 'abiertas';
var buscaFacturas = '';

function facturasFiltradas(){
  var hoy = hoyISO();
  var q = buscaFacturas.trim().toLowerCase();
  return S.facturas.filter(function(f){
    var pag = estaPagada(f);
    if(filtroFacturas === 'abiertas' && pag) return false;
    if(filtroFacturas === 'vencidas' && (pag || diasVencido(f,hoy) < 0)) return false;
    if(filtroFacturas === 'pagadas' && !pag) return false;
    if(q){
      var t = (f.folio||'') + ' ' + nombreCliente(f.clienteId) + ' ' + (f.notas||'');
      if(t.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function(a,b){
    return String(a.vence||'').localeCompare(String(b.vence||''));
  });
}
function renderFacturas(){
  var el = $('#tab-facturas');
  var lista = facturasFiltradas();
  var hoy = hoyISO();
  var suma = lista.reduce(function(a,f){ return a + saldo(f); }, 0);

  var filas = lista.map(function(f){
    var d = diasVencido(f, hoy);
    var pag = estaPagada(f);
    var b = bucketDe(d);
    var etiqueta = pag ? 'Pagada' : d < 0 ? 'Vigente' : d === 0 ? 'Vence hoy' : (d+' días');
    var color = pag ? 'var(--good)' : b.color;
    return '<tr>'+
      '<td>'+esc(f.folio||'—')+'</td>'+
      '<td>'+esc(nombreCliente(f.clienteId))+'</td>'+
      '<td>'+esc(fmtFecha(f.vence))+'</td>'+
      '<td class="num">'+esc(moneda(num(f.monto)))+'</td>'+
      '<td class="num">'+esc(moneda(saldo(f)))+'</td>'+
      '<td><span class="pill"><i class="dot" style="background:'+color+'"></i>'+esc(etiqueta)+'</span></td>'+
      '<td class="num">'+
        '<button class="btn sm" data-act="pago" data-id="'+esc(f.id)+'"'+(pag?' disabled':'')+'>Pago</button> '+
        '<button class="btn sm ghost" data-act="editar-factura" data-id="'+esc(f.id)+'">Editar</button>'+
      '</td>'+
    '</tr>';
  }).join('');

  el.innerHTML =
    '<div class="card">'+
      '<div class="card-h">'+
        '<h2>Facturas</h2>'+
        '<span class="sub">'+lista.length+' en pantalla · saldo '+esc(moneda(suma))+'</span>'+
      '</div>'+
      '<div class="row" style="margin-bottom:12px">'+
        '<select id="filtro-fact" style="width:auto">'+
          opt('abiertas','Abiertas', filtroFacturas)+
          opt('vencidas','Solo vencidas', filtroFacturas)+
          opt('pagadas','Pagadas', filtroFacturas)+
          opt('todas','Todas', filtroFacturas)+
        '</select>'+
        '<input type="text" id="busca-fact" placeholder="Buscar folio o cliente" value="'+esc(buscaFacturas)+'" style="width:auto;flex:1;min-width:180px">'+
        '<button class="btn primary" data-act="nueva-factura">+ Factura</button>'+
        '<button class="btn" data-act="importar">Importar</button>'+
        '<button class="btn" data-act="exportar-csv">Exportar CSV</button>'+
      '</div>'+
      (lista.length ?
        '<div class="tbl-wrap"><table class="data">'+
          '<thead><tr><th>Folio</th><th>Cliente</th><th>Vence</th><th class="num">Monto</th><th class="num">Saldo</th><th>Estado</th><th></th></tr></thead>'+
          '<tbody>'+filas+'</tbody>'+
        '</table></div>'
        : '<div class="empty"><h3>Nada por aquí</h3><p>No hay facturas con ese filtro.</p></div>')+
    '</div>';

  var sel = $('#filtro-fact');

/* ============================ CSV: leer y escribir ====================== */
function partirCSV(texto){
  var delim = ',';
  var head = texto.split(/\r?\n/)[0] || '';
  if(head.split('\t').length > head.split(',').length) delim = '\t';
  else if(head.split(';').length > head.split(',').length) delim = ';';

  var filas = [], campo = '', fila = [], enCom = false;
  for(var i=0;i<texto.length;i++){
    var ch = texto[i];
    if(enCom){
      if(ch === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else enCom = false;
      } else campo += ch;
    } else if(ch === '"'){ enCom = true; }
    else if(ch === delim){ fila.push(campo); campo = ''; }
    else if(ch === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ''; }
    else if(ch === '\r'){ /* nada */ }
    else campo += ch;
  }
  if(campo.length || fila.length){ fila.push(campo); filas.push(fila); }
  return filas.filter(function(f){ return f.some(function(c){ return String(c).trim() !== ''; }); });
}
function normaliza(s){
  return String(s||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function fechaLibre(v){
  var s = String(v||'').trim();
  if(!s) return '';
  var m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if(m){
    var y = +m[3]; if(y < 100) y += 2000;
    return y+'-'+pad(+m[2])+'-'+pad(+m[1]);   // día/mes/año, como se usa en español
  }
  var d = new Date(s);
  if(!isNaN(d.getTime())) return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  return '';
}
function importarTexto(texto){
  var filas = partirCSV(texto);
  if(filas.length < 2) return {error:'Hacen falta al menos el encabezado y una fila.'};
  var cab = filas[0].map(normaliza);
  function col(){
    for(var a=0;a<arguments.length;a++){
      var i = cab.indexOf(arguments[a]);
      if(i !== -1) return i;
    }
    return -1;
  }
  var iCli = col('cliente','nombre','razonsocial','clientenombre');
  var iTel = col('telefono','tel','whatsapp','celular','movil');
  var iFol = col('folio','factura','numero','nofactura','folio factura');
  var iFec = col('fecha','fechaemision','emision','fechafactura');
  var iVen = col('vence','vencimiento','fechavencimiento','fechavence','vencehasta');
  var iMon = col('monto','importe','total','saldo','valor');

  if(iMon === -1) return {error:'No encontré la columna de monto (monto, importe o total).'};
  if(iCli === -1) return {error:'No encontré la columna de cliente.'};

  var nuevas = 0, nuevosCli = 0, saltadas = 0;
  for(var r=1;r<filas.length;r++){
    var f = filas[r];
    var nom = String(f[iCli]||'').trim();
    var monto = num(f[iMon]);
    if(!nom || !monto){ saltadas++; continue; }

    var c = null;
    for(var k=0;k<S.clientes.length;k++){
      if(normaliza(S.clientes[k].nombre) === normaliza(nom)){ c = S.clientes[k]; break; }
    }
    if(!c){
      c = {id:uid(), nombre:nom, telefono:iTel!==-1?String(f[iTel]||'').trim():'', email:'', notas:''};
      S.clientes.push(c); nuevosCli++;
    } else if(iTel !== -1 && !c.telefono && String(f[iTel]||'').trim()){
      c.telefono = String(f[iTel]).trim();
    }

    var fecha = iFec!==-1 ? fechaLibre(f[iFec]) : '';
    var vence = iVen!==-1 ? fechaLibre(f[iVen]) : '';
    if(!vence) vence = fecha || hoyISO();

    S.facturas.push({
      id: uid(),
      clienteId: c.id,
      folio: iFol!==-1 ? String(f[iFol]||'').trim() : '',
      fecha: fecha || vence,
      vence: vence,
      monto: monto,
      pagos: [],
      gestiones: [],
      notas: ''
    });
    nuevas++;
  }
  return {nuevas:nuevas, nuevosCli:nuevosCli, saltadas:saltadas};
}
function csvFacturas(){
  var sep = ',';
  var lineas = [['folio','cliente','telefono','emision','vence','monto','pagado','saldo','dias_atraso','estado'].join(sep)];
  var hoy = hoyISO();
  S.facturas.slice().sort(function(a,b){ return String(a.vence).localeCompare(String(b.vence)); }).forEach(function(f){
    var c = cliente(f.clienteId) || {};
    var d = diasVencido(f, hoy);
    var est = estaPagada(f) ? 'pagada' : (d>=0 ? 'vencida' : 'vigente');
    lineas.push([
      q(f.folio), q(c.nombre||''), q(c.telefono||''), f.fecha||'', f.vence||'',
      num(f.monto).toFixed(2), pagado(f).toFixed(2), saldo(f).toFixed(2),
      estaPagada(f)?'':Math.max(0,d), est
    ].join(sep));
  });
  return '﻿' + lineas.join('\r\n');
  function q(v){
    var s = String(v==null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }
}

  defs.forEach(function(d){
    var pagos = d[5] > 0 ? [{fecha:iso(-7), monto:d[5], nota:'Abono por transferencia'}] : [];
    S.facturas.push({
      id: uid(), clienteId: cls[d[0]].id, folio: d[1],
      fecha: iso(d[2]), vence: iso(d[3]), monto: d[4],
      pagos: pagos, gestiones: [], notas: ''
    });
  });
  if(!S.empresa.nombre) S.empresa.nombre = 'Mi negocio';
  guardar(); renderTodo();
  toast('Datos de ejemplo cargados');
}

/* ================================ acciones ============================== */
var ACCIONES = {
  'cerrar': cerrarModal,
  'ir-cobrar': function(){ irA('cobrar'); },
  'demo': cargarDemo,
  'ver-pro': function(){ modalPro(''); },
  'activar': modalActivar,

  'nueva-factura': function(){
    if(!esPro() && abiertas().length >= LIMITE_GRATIS){
      modalPro('El plan gratis llega hasta '+LIMITE_GRATIS+' facturas abiertas y ya las tienes. '+
               'Puedes registrar pagos para liberar espacio o pasar a Pro.');
      return;
    }
    modalFactura(null);
  },
  'editar-factura': function(el){ modalFactura(el.getAttribute('data-id')); },
  'guardar-factura': function(el){
    var id = el.getAttribute('data-id');
    var f = id ? factura(id) : null;
    var nombreNuevo = $('#f-cliente-nuevo').value.trim();
    var cid = $('#f-cliente').value;
    var monto = num($('#f-monto').value);
    var vence = $('#f-vence').value;

    if(!cid && !nombreNuevo){ toast('Falta el cliente'); return; }
    if(!monto){ toast('Falta el monto'); return; }
    if(!vence){ toast('Falta la fecha de vencimiento'); return; }

    if(!cid){
      var ex = null;
      for(var i=0;i<S.clientes.length;i++){
        if(normaliza(S.clientes[i].nombre) === normaliza(nombreNuevo)){ ex = S.clientes[i]; break; }
      }
      if(ex) cid = ex.id;
      else {
        var c = {id:uid(), nombre:nombreNuevo, telefono:'', email:'', notas:''};
        S.clientes.push(c); cid = c.id;
      }
    }
    var datos = {
      clienteId: cid,
      folio: $('#f-folio').value.trim(),
      fecha: $('#f-fecha').value || vence,
      vence: vence,
      monto: monto,
      notas: $('#f-notas').value.trim()
    };
    if(f) Object.assign(f, datos);
    else S.facturas.push(Object.assign({id:uid(), pagos:[], gestiones:[]}, datos));

    guardar(); cerrarModal(); renderTodo();
    toast(f ? 'Factura actualizada' : 'Factura agregada');
  },
  'borrar-factura': function(el){
    if(!confirm('¿Eliminar esta factura? No se puede deshacer.')) return;
    var id = el.getAttribute('data-id');
    S.facturas = S.facturas.filter(function(f){ return f.id !== id; });
    guardar(); cerrarModal(); renderTodo();
  },

  'nuevo-cliente': function(){ modalCliente(null); },
  'editar-cliente': function(el){
    var id = el.getAttribute('data-id');
    if(id) modalCliente(id); else modalCliente(null);
  },
  'guardar-cliente': function(el){
    var id = el.getAttribute('data-id');
    var nom = $('#c-nombre').value.trim();
    if(!nom){ toast('Falta el nombre'); return; }
    var datos = {
      nombre: nom,
      telefono: $('#c-tel').value.trim(),
      email: $('#c-mail').value.trim(),
      notas: $('#c-notas').value.trim()
    };
    var c = id ? cliente(id) : null;
    if(c) Object.assign(c, datos);
    else S.clientes.push(Object.assign({id:uid()}, datos));
    guardar(); cerrarModal(); renderTodo();
    toast('Cliente guardado');
  },
  'borrar-cliente': function(el){
    var id = el.getAttribute('data-id');
    var n = S.facturas.filter(function(f){ return f.clienteId===id; }).length;
    if(n && !confirm('Este cliente tiene '+n+' factura(s). Se eliminan también. ¿Seguir?')) return;
    if(!n && !confirm('¿Eliminar el cliente?')) return;
    S.facturas = S.facturas.filter(function(f){ return f.clienteId !== id; });
    S.clientes = S.clientes.filter(function(c){ return c.id !== id; });
    guardar(); cerrarModal(); renderTodo();
  },

  'pago': function(el){ modalPago(el.getAttribute('data-id')); },
  'guardar-pago': function(el){
    var f = factura(el.getAttribute('data-id'));
    if(!f) return;
    var monto = num($('#pg-monto').value);
    if(!monto){ toast('Falta el monto'); return; }
    f.pagos = f.pagos || [];
    f.pagos.push({fecha: $('#pg-fecha').value || hoyISO(), monto: monto, nota: $('#pg-nota').value.trim()});
    guardar(); cerrarModal(); renderTodo();
    toast(estaPagada(f) ? '¡Factura saldada!' : 'Abono registrado');
  },
  'borrar-pago': function(el){
    var f = factura(el.getAttribute('data-id'));
    if(!f) return;
    f.pagos.splice(parseInt(el.getAttribute('data-i'),10), 1);
    guardar(); cerrarModal(); renderTodo();
  },

  'gestion': function(el){ modalGestion(el.getAttribute('data-id')); },
  'guardar-gestion': function(el){
    var f = factura(el.getAttribute('data-id'));
    if(!f) return;
    f.gestiones = f.gestiones || [];
    f.gestiones.push({fecha: hoyISO(), nota: $('#g-nota').value.trim()});
    guardar(); cerrarModal(); renderTodo();
    toast('Gestión anotada');
  },

  'copiar-msg': function(el){
    var id = el.getAttribute('data-id');
    var ta = document.querySelector('[data-msg="'+id+'"]');
    copiar(ta ? ta.value : mensajeDe(factura(id)));
  },
  'copiar-todo': function(){
    var txt = colaCobro().map(function(x){
      var c = cliente(x.f.clienteId);
      return [
        (c?c.nombre:'(sin cliente)'),
        'factura '+(x.f.folio||'s/folio'),
        moneda(x.saldo),
        (x.dias >= 0 ? x.dias+' días de atraso' : 'vence en '+Math.abs(x.dias)+' días'),
        (c && c.telefono ? c.telefono : 'sin teléfono')
      ].join(' · ');
    }).join('\n');
    copiar(txt);
  },

  'estado-cuenta': function(el){
    if(!exigirPro('El estado de cuenta imprimible es parte de Pro.')) return;
    estadoDeCuenta(el.getAttribute('data-id'));
  },
  'exportar-csv': function(){
    if(!exigirPro('Exportar a CSV es parte de Pro.')) return;
    descargar('facturas-'+hoyISO()+'.csv', csvFacturas(), 'text/csv');
    toast('CSV descargado');
  },
  'respaldo': function(){
    if(!exigirPro('El respaldo de tus datos es parte de Pro.')) return;
    descargar('respaldo-cobranza-'+hoyISO()+'.json', JSON.stringify(S, null, 2), 'application/json');
    toast('Respaldo descargado');
  },
  'restaurar': function(){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.addEventListener('change', function(){
      var file = inp.files[0]; if(!file) return;
      var fr = new FileReader();
      fr.onload = function(){
        try {
          var d = JSON.parse(String(fr.result));
          if(!d || !Array.isArray(d.facturas)) throw new Error('formato');
          if(!confirm('Esto reemplaza los datos que tienes ahora. ¿Seguir?')) return;
          localStorage.setItem(STORE, JSON.stringify(d));
          cargar(); renderTodo();
          toast('Respaldo restaurado');
        } catch(e){ toast('Ese archivo no es un respaldo válido'); }
      };
      fr.readAsText(file, 'utf-8');
    });
    inp.click();
  },
  'borrar-todo': function(){
    if(!confirm('Se borran todas las facturas y clientes de este navegador. ¿Seguro?')) return;
    if(!confirm('Última confirmación: esto no se puede deshacer.')) return;
    var lic = S.licencia;
    S = estadoInicial();
    S.licencia = lic;
    guardar(); renderTodo();
    toast('Datos borrados');
  },

  'importar': modalImportar,
  'plantilla-csv': function(){
    descargar('plantilla-facturas.csv',
      '﻿cliente,telefono,folio,fecha,vence,monto\r\n'+
      'Abarrotes López,5512345678,A-1001,2026-08-01,2026-08-31,12500\r\n'+
      'Café Miranda,5544332211,A-1002,2026-08-05,2026-09-04,7400\r\n', 'text/csv');
  },
  'hacer-import': function(){
    var texto = $('#imp-texto').value;
    if(!texto.trim()){ toast('Pega tus datos primero'); return; }
    var antes = JSON.stringify({c:S.clientes, f:S.facturas});
    var res = importarTexto(texto);
    if(res.error){
      $('#imp-msg').innerHTML = '<div class="note crit" style="margin-top:12px">'+esc(res.error)+'</div>';
      return;
    }
    if(!esPro() && abiertas().length > LIMITE_GRATIS){
      var prev = JSON.parse(antes);
      S.clientes = prev.c; S.facturas = prev.f;
      $('#imp-msg').innerHTML = '<div class="note warn" style="margin-top:12px">La importación deja '+
        'más de '+LIMITE_GRATIS+' facturas abiertas, que es el tope del plan gratis. '+
        'No se importó nada. <a href="#" data-act="ver-pro">Pasar a Pro</a></div>';
      return;
    }
    guardar(); cerrarModal(); renderTodo();
    toast(res.nuevas+' facturas y '+res.nuevosCli+' clientes nuevos'+(res.saltadas?' ('+res.saltadas+' filas saltadas)':''));
  },

  'guardar-empresa': function(){
    S.empresa.nombre = $('#a-nombre').value.trim();
    S.empresa.moneda = $('#a-moneda').value;
    S.empresa.pais = $('#a-pais').value.replace(/\D/g,'');
    S.empresa.firma = $('#a-firma').value.trim();
    var av = parseInt($('#a-aviso').value,10);
    S.ajustes.avisoPrevio = isFinite(av) ? Math.max(0, Math.min(30, av)) : 3;
    guardar(); renderTodo();
    toast('Guardado');
  },
  'guardar-plantillas': function(){
    if(!exigirPro('Editar plantillas es parte de Pro.')) return;
    S.plantillas.previo = $('#p-previo').value;
    S.plantillas.leve   = $('#p-leve').value;
    S.plantillas.media  = $('#p-media').value;
    S.plantillas.fuerte = $('#p-fuerte').value;
    guardar(); renderTodo();
    toast('Plantillas guardadas');
  },
  'reset-plantillas': function(){
    if(!exigirPro('Editar plantillas es parte de Pro.')) return;
    S.plantillas = JSON.parse(JSON.stringify(PLANTILLAS_DEFAULT));
    guardar(); renderTodo();
    toast('Plantillas restauradas');
  },
  'guardar-licencia': function(){
    var correo = $('#lic-correo').value.trim();
    var clave = $('#lic-clave').value.trim().toUpperCase();
    if(claveDe(correo) !== clave){
      toast('Esa clave no corresponde a ese correo');
      return;
    }
    S.licencia = {correo:correo, clave:clave};
    guardar(); cerrarModal(); renderTodo();
    toast('¡Pro activado! Gracias.');
  },
  'quitar-licencia': function(){
    if(!confirm('¿Quitar la licencia de este equipo?')) return;
    S.licencia = null;
    guardar(); renderTodo();
  }
};

/* ============================== enrutamiento ============================ */
var tabActual = 'panel';
function irA(t){
  tabActual = t;
  $$('.tab').forEach(function(b){ b.setAttribute('aria-selected', String(b.getAttribute('data-tab')===t)); });
  ['panel','cobrar','facturas','clientes','ajustes'].forEach(function(k){
    $('#tab-'+k).hidden = (k !== t);
  });
  renderTab(t);
  window.scrollTo(0,0);
}
function renderTab(t){
  if(t==='panel') renderPanel();
  else if(t==='cobrar') renderCobrar();
  else if(t==='facturas') renderFacturas();
  else if(t==='clientes') renderClientes();
  else if(t==='ajustes') renderAjustes();
}
function renderTodo(){
  var r = resumen();
  var cola = colaCobro().length;
  $('#c-cobrar').textContent = cola;
  $('#c-cobrar').className = 'count' + (r.nVencidas ? ' alerta' : '');
  $('#c-facturas').textContent = abiertas().length;
  $('#c-clientes').textContent = S.clientes.length;
  var badge = $('#plan-badge');
  badge.textContent = esPro() ? 'Pro' : ('Gratis · '+abiertas().length+'/'+LIMITE_GRATIS);
  badge.className = 'plan' + (esPro() ? ' pro' : '');
  $('#empresa-label').textContent = S.empresa.nombre || 'Tu cartera, bajo control';
  document.title = (r.vencido > 0 ? monedaCorta(r.vencido)+' vencido · ' : '') + 'Cobranza al Día';
  renderTab(tabActual);
}

/* ============================== eventos ================================= */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(el){
    var act = el.getAttribute('data-act');
    if(act === 'whats'){
      var f = factura(el.getAttribute('data-id'));
      if(!f) return;
      var ta = document.querySelector('[data-msg="'+f.id+'"]');
      el.href = linkWhats(f, ta ? ta.value : mensajeDe(f));
      f.gestiones = f.gestiones || [];
      f.gestiones.push({fecha:hoyISO(), nota:'Mensaje enviado por WhatsApp'});
      guardar();
      setTimeout(renderTodo, 400);
      return;   // deja que el enlace abra WhatsApp
    }
    if(ACCIONES[act]){
      e.preventDefault();
      ACCIONES[act](el);
      return;
    }
  }
  var tab = e.target.closest('.tab');
  if(tab) irA(tab.getAttribute('data-tab'));
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') cerrarModal();
});
$('#btn-nueva-factura').addEventListener('click', function(){ ACCIONES['nueva-factura'](); });

/* =============================== arranque =============================== */
cargar();
renderTodo();
window.addEventListener('storage', function(e){ if(e.key === STORE){ cargar(); renderTodo(); } });

/* Generador de claves, para el dueño de la app: en la consola escribe
   cobranzaClave('correo@delcliente.com')  */
window.cobranzaClave = claveDe;

})();
</script>
